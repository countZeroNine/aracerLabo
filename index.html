// 8-stop HSL gradient for AFR colormap, calibrated to engine target band
// 配色慣例：青 = 濃い（リッチ・安全域）、赤 = 薄い（リーン・危険域）
//   aRacer SpeedTuning / HONDA 燃調ソフトの慣例に準拠
//   blue (very rich) → teal → green (target low) → lime (target mid) → yellow-green → yellow (stoich) → orange (lean) → red (very lean)
const afrColor = (afr) => {
  if (afr <= 0 || isNaN(afr)) return null;
  const t = AFR_TARGET;
  const stops = [
    { afr: AFR_DISPLAY_MIN, color: [220, 80, 50] },   // deep blue (very rich, safe)
    { afr: 11.0,            color: [200, 70, 50] },   // blue
    { afr: t.low,           color: [170, 65, 45] },   // teal
    { afr: t.mid,           color: [110, 70, 45] },   // green / target
    { afr: t.high,          color: [80,  70, 50] },   // yellow-green
    { afr: 14.7,            color: [50,  85, 55] },   // yellow / stoich
    { afr: 16.5,            color: [25,  85, 55] },   // orange
    { afr: AFR_DISPLAY_MAX, color: [0,   80, 50] },   // deep red (very lean, danger)
  ];
  for (let i = 1; i < stops.length; i++) {
    if (afr <= stops[i].afr) {
      const a = stops[i-1], b = stops[i];
      const f = (afr - a.afr) / (b.afr - a.afr || 1);
      const h = a.color[0] + (b.color[0] - a.color[0]) * f;
      const s = a.color[1] + (b.color[1] - a.color[1]) * f;
      const l = a.color[2] + (b.color[2] - a.color[2]) * f;
      return `hsl(${h}, ${s}%, ${l}%)`;
    }
  }
  return `hsl(0, 80%, 50%)`;
};

// ─── Deviation color: WBO2 - Target ─────────────────────────
// 0 = green (perfectly hitting target), + = warm (lean / danger), - = cool (rich / safe)
// 表示範囲は ±3 を上限の目安に。aRacer SpeedTuning の AFR Cal. 系慣例（リーン=危険=赤）に合わせる
const DEV_DISPLAY_MIN = -3.0;
const DEV_DISPLAY_MAX = +3.0;
const devColor = (dev) => {
  if (!Number.isFinite(dev)) return null;
  const stops = [
    { dev: DEV_DISPLAY_MIN, color: [220, 80, 50] },   // deep blue (>3 rich)
    { dev: -2.0,            color: [200, 75, 50] },   // blue
    { dev: -1.0,            color: [180, 70, 48] },   // teal
    { dev: -0.3,            color: [140, 70, 45] },   // green-teal
    { dev:  0.0,            color: [120, 80, 45] },   // green (target)
    { dev: +0.3,            color: [ 80, 75, 48] },   // yellow-green
    { dev: +1.0,            color: [ 50, 85, 52] },   // yellow
    { dev: +2.0,            color: [ 25, 85, 52] },   // orange
    { dev: DEV_DISPLAY_MAX, color: [  0, 80, 48] },   // deep red (>3 lean)
  ];
  if (dev <= stops[0].dev) {
    const c = stops[0].color;
    return `hsl(${c[0]}, ${c[1]}%, ${c[2]}%)`;
  }
  for (let i = 1; i < stops.length; i++) {
    if (dev <= stops[i].dev) {
      const a = stops[i-1], b = stops[i];
      const f = (dev - a.dev) / (b.dev - a.dev || 1);
      const h = a.color[0] + (b.color[0] - a.color[0]) * f;
      const s = a.color[1] + (b.color[1] - a.color[1]) * f;
      const l = a.color[2] + (b.color[2] - a.color[2]) * f;
      return `hsl(${h}, ${s}%, ${l}%)`;
    }
  }
  const c = stops[stops.length-1].color;
  return `hsl(${c[0]}, ${c[1]}%, ${c[2]}%)`;
};

// ─── Lean spot detection (Track Map にコース上の危険箇所を可視化) ───
// 別スレの実走分析で確立された定義をベース：
//   注意・警戒は TPS≥30% / RPM≥4000 でアクセル開いている時の燃調不足を検出
//   危険（AFR≥18.0、センサ振り切れ）は TPS gate なし → エンブレ中の致命的リーンもキャッチ
const LEAN_SPOT_THRESHOLDS = {
  caution:  { afrMin: 14.7, afrMax: 16.5, tpsMin: 30, rpmMin: 4000, color: "#eab308", radius: 4, label: "注意"  },
  warning:  { afrMin: 16.5, afrMax: 18.0, tpsMin: 30, rpmMin: 4000, color: "#f97316", radius: 5, label: "警戒"  },
  danger:   { afrMin: 18.0, afrMax: 99.0, tpsMin:  0, rpmMin: 4000, color: "#ef4444", radius: 6, label: "危険"  },
};
const LEAN_SPOT_MAX_MARKERS = 500;

const computeLeanSpots = (samples) => {
  if (!samples?.length) return { caution: [], warning: [], danger: [], total: 0, fcTotal: 0 };
  const out = { caution: [], warning: [], danger: [], total: 0, fcTotal: 0 };
  for (const s of samples) {
    if (!Number.isFinite(s.Lat) || !Number.isFinite(s.Lon)) continue;
    if (!s.Afr || s.Afr < 14.7) continue;
    if (!s.Rpm || s.Rpm < 4000) continue;
    // 燃料カット中フラグ（0/1）— 不明なら 0 扱い
    const fuelCut = !!s.FuelCutDec;
    const spot = { lat: s.Lat, lon: s.Lon, afr: s.Afr, rpm: s.Rpm, tps: s.Tps, time: s.RunTime, fuelCut };
    // 強度判定（高い方から優先評価）
    if (s.Afr >= LEAN_SPOT_THRESHOLDS.danger.afrMin) {
      out.danger.push(spot);
    } else if (s.Afr >= LEAN_SPOT_THRESHOLDS.warning.afrMin && s.Tps >= LEAN_SPOT_THRESHOLDS.warning.tpsMin) {
      out.warning.push(spot);
    } else if (s.Afr >= LEAN_SPOT_THRESHOLDS.caution.afrMin && s.Tps >= LEAN_SPOT_THRESHOLDS.caution.tpsMin) {
      out.caution.push(spot);
    } else {
      continue;
    }
    if (fuelCut) out.fcTotal++;
  }
  out.total = out.caution.length + out.warning.length + out.danger.length;
  // 「実害候補（燃料カット OFF）」のカウントも事前計算
  out.dangerReal  = out.danger.filter(s => !s.fuelCut).length;
  out.warningReal = out.warning.filter(s => !s.fuelCut).length;
  out.cautionReal = out.caution.filter(s => !s.fuelCut).length;
  out.dangerFC    = out.danger.length - out.dangerReal;
  out.warningFC   = out.warning.length - out.warningReal;
  out.cautionFC   = out.caution.length - out.cautionReal;
  return out;
};

// ─── aRacer .loga parser (copied from drogger_analyzer) ──────
const detectLogFormat = (text) => {
  const firstLine = text.split("\n", 1)[0].trim();
  if (firstLine.startsWith("<aRacer APP Log Data for RaceAMP>"))     return "aracer_sp";
  if (firstLine.startsWith("<Cycling Memory Log Data of Super ECU>")) return "aracer_ecu";
  if (firstLine.startsWith("<ECU Memory Log Data of Super ECU>"))     return "aracer_ecu";
  if (firstLine.startsWith("<aRacer ECU_Memory Log Data for RaceAMP>")) return "aracer_lm";
  return "unknown";
};

const parseAracerLog = (text, format) => {
  const lines = text.split(/\r?\n/);
  if (lines.length < 8) throw new Error("aRacer ログのデータ行が不足しています");

  const headers = lines[5].split(",");
  const normalizeHeader = (h) => {
    const beforeSlash = h.split("/")[0];
    const afterDot = beforeSlash.split(".").pop();
    return afterDot.trim().toLowerCase();
  };
  const normalizedHeaders = headers.map(normalizeHeader);
  const findIdx = (...patterns) => {
    for (const p of patterns) {
      const idx = normalizedHeaders.indexOf(p.toLowerCase());
      if (idx >= 0) return idx;
    }
    return -1;
  };

  const idx = {
    Rpm:          findIdx("rpm"),
    Speed:        findIdx("vehicle_speed_filtered", "vehicle_speed", "gps_speed"),
    Afr:          findIdx("afr_wbo2_cal", "afr"),  // 実測（WBO2 優先・AFR フォールバック）
    AfrTarget:    findIdx("afr"),                   // ターゲット AFR（ECU が狙う値、偏差分析用）
    AfrAlt:       findIdx("af1_afr"),
    NbO2Volt:     findIdx("nbo2_volt"),
    Tps:          findIdx("tps_percent"),
    Volt:         findIdx("volt_batt_indx"),
    AirTemp:      findIdx("t_air_indx"),
    Lap:          findIdx("ir_lapnumber"),
    LapTime:      findIdx("ir_laptime"),
    Gear:         findIdx("gearnum"),
    LeanAngle:    findIdx("tc_lean_angle"),
    MapNum:       findIdx("mapnum"),
    Wbo2AtEn:     findIdx("wbo2_at_en"),
    Wbo2Ready:    findIdx("wbo2_ready"),
    PowerEn:      findIdx("power_en"),
    RpmLimit:     findIdx("rpm_limit"),
    FuelCutDec:   findIdx("dec_fc_en"),     // Fuel1.Dec_FC_En = 減速燃料カット作動フラグ（0/1）
    // GPS（LM形式 / RFM2.5装着 ECU形式 で取得可能）
    // 2系統のカラム命名規則に対応：
    //   (a) SP形式（aRacer Smart アプリ公式マニュアル準拠）: GPS_latitude / GPS_longitude を十進度で直接保持
    //   (b) LM/ECU形式（NMEA 0183 風 multi-column DMS）: GPS_Lat_deg / GPS_Lat_min / GPS_Lat_mmmm / GPS_Lat_NS
    GpsLatDecimal: findIdx("gps_latitude"),
    GpsLonDecimal: findIdx("gps_longitude"),
    GpsLatDeg:    findIdx("gps_lat_deg"),
    GpsLatMin:    findIdx("gps_lat_min"),
    GpsLatMmmm:   findIdx("gps_lat_mmmm"),
    GpsLatNS:     findIdx("gps_lat_ns"),
    GpsLonDeg:    findIdx("gps_lon_deg"),
    GpsLonMin:    findIdx("gps_lon_min"),
    GpsLonMmmm:   findIdx("gps_lon_mmmm"),
    GpsLonEW:     findIdx("gps_lon_ew"),
    GpsSpeed:     findIdx("gps_speed"),
  };
  const hasGpsDecimal = idx.GpsLatDecimal >= 0 && idx.GpsLonDecimal >= 0;
  const hasGpsDms = idx.GpsLatDeg >= 0 && idx.GpsLonDeg >= 0;
  const hasGps = hasGpsDecimal || hasGpsDms;

  // Auto-downsample if source rate >12Hz to keep memory & rendering reasonable
  const probeRows = Math.min(100, lines.length - 7);
  let sampleStride = 1;
  if (probeRows > 10) {
    const t0 = parseFloat(lines[6].split(",")[0]);
    const tEnd = parseFloat(lines[6 + probeRows - 1].split(",")[0]);
    if (!isNaN(t0) && !isNaN(tEnd) && tEnd > t0) {
      const hz = (probeRows - 1) / ((tEnd - t0) / 1000);
      if (hz > 12) sampleStride = Math.max(1, Math.round(hz / 10));
    }
  }

  const data = [];
  for (let li = 6; li < lines.length; li += sampleStride) {
    const line = lines[li];
    if (!line || !line.length) continue;
    const parts = line.split(",");
    const tMs = parseFloat(parts[0]);
    if (isNaN(tMs)) continue;

    const num = (i) => i >= 0 && i < parts.length ? (parseFloat(parts[i]) || 0) : 0;
    const intNum = (i) => i >= 0 && i < parts.length ? (parseInt(parts[i], 10) || 0) : 0;

    // GPS デコード
    let lat = NaN, lon = NaN;
    if (hasGpsDecimal) {
      // SP形式: 十進度をそのまま使用
      const _lat = num(idx.GpsLatDecimal), _lon = num(idx.GpsLonDecimal);
      if (_lat >= -90 && _lat <= 90 && _lon >= -180 && _lon <= 180 &&
          !(Math.abs(_lat) < 0.01 && Math.abs(_lon) < 0.01)) {
        lat = _lat; lon = _lon;
      }
    } else if (hasGpsDms) {
      // LM/ECU形式: NMEA 0183 風 deg + min + 1/10000分 + 半球
      const lDeg = num(idx.GpsLatDeg), lMin = num(idx.GpsLatMin), lMmm = num(idx.GpsLatMmmm);
      const oDeg = num(idx.GpsLonDeg), oMin = num(idx.GpsLonMin), oMmm = num(idx.GpsLonMmmm);
      const ns = intNum(idx.GpsLatNS), ew = intNum(idx.GpsLonEW);
      // ASCII: N=78 S=83 E=69 W=87
      let _lat = lDeg + (lMin + lMmm / 10000) / 60;
      let _lon = oDeg + (oMin + oMmm / 10000) / 60;
      if (ns === 83) _lat = -_lat;
      if (ew === 87) _lon = -_lon;
      if (_lat >= -90 && _lat <= 90 && _lon >= -180 && _lon <= 180 &&
          !(Math.abs(_lat) < 0.01 && Math.abs(_lon) < 0.01)) {
        lat = _lat; lon = _lon;
      }
    }

    data.push({
      RunTime:     tMs / 1000,
      Rpm:         num(idx.Rpm),
      Speed:       num(idx.Speed),
      Afr:         num(idx.Afr),
      AfrTarget:   num(idx.AfrTarget),
      AfrAlt:      num(idx.AfrAlt),
      NbO2Volt:    num(idx.NbO2Volt),
      Tps:         num(idx.Tps),
      Volt:        num(idx.Volt),
      AirTemp:     num(idx.AirTemp),
      Gear:        intNum(idx.Gear),
      LeanAngle:   num(idx.LeanAngle),
      Lap:         intNum(idx.Lap),
      MapNum:      intNum(idx.MapNum),
      Wbo2AtEn:    intNum(idx.Wbo2AtEn),
      Wbo2Ready:   intNum(idx.Wbo2Ready),
      PowerEn:     intNum(idx.PowerEn),
      RpmLimit:    intNum(idx.RpmLimit),
      FuelCutDec:  intNum(idx.FuelCutDec),
      Lat:         lat,
      Lon:         lon,
      GpsSpeed:    num(idx.GpsSpeed),
    });
  }

  // GPS が実データとして存在するか（カラム名はあっても全行0だと意味がない）
  const gpsValidCount = data.filter(d => !isNaN(d.Lat) && !isNaN(d.Lon)).length;
  const hasValidGps = gpsValidCount > Math.max(10, data.length * 0.05);

  return { data, format, sampleStride, totalRows: lines.length - 6, hasValidGps, gpsValidCount };
};

// ─── GPS / Geo ヘルパー ───────────────────────────────────────
// ハーバサイン距離（メートル）
const haversine = (la1, lo1, la2, lo2) => {
  const R = 6371000;
  const r = (x) => x * Math.PI / 180;
  const dLa = r(la2 - la1), dLo = r(lo2 - lo1);
  const a = Math.sin(dLa/2)**2 + Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dLo/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
};

// 走行データの GPS 重心からサーキットを自動判定（距離が一定以下なら該当）
const detectCircuit = (samples) => {
  const valid = samples.filter(s => !isNaN(s.Lat) && !isNaN(s.Lon));
  if (valid.length === 0) return null;
  const cLat = valid.reduce((a, s) => a + s.Lat, 0) / valid.length;
  const cLon = valid.reduce((a, s) => a + s.Lon, 0) / valid.length;
  let best = null, bestDist = Infinity;
  for (const c of CIRCUITS) {
    // フィニッシュライン2点の中点をサーキット中心の代表として使う
    const fLat = (c.finishLine[0].lat + c.finishLine[1].lat) / 2;
    const fLon = (c.finishLine[0].lon + c.finishLine[1].lon) / 2;
    const d = haversine(cLat, cLon, fLat, fLon);
    if (d < bestDist) { bestDist = d; best = c; }
  }
  // 5km 以内なら該当サーキット、それ以上はサーキット未登録扱い
  return bestDist < 5000 ? { circuit: best, distFromFinishM: bestDist, centroid: { lat: cLat, lon: cLon } } : null;
};

// 2線分の交差判定（フィニッシュライン横断検出用）
const segmentsIntersect = (p1, p2, p3, p4) => {
  const cross = (a, b) => a.x * b.y - a.y * b.x;
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const r = sub(p2, p1), s = sub(p4, p3);
  const rxs = cross(r, s);
  if (Math.abs(rxs) < 1e-12) return false;
  const t = cross(sub(p3, p1), s) / rxs;
  const u = cross(sub(p3, p1), r) / rxs;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
};

// フィニッシュラインを基準にラップを自動分割
// IR_LapNumber が無くても GPS 軌跡だけで動く
const detectLapsByFinishLine = (samples, finishLine) => {
  if (!finishLine || samples.length < 2) return [];
  const fA = { x: finishLine[0].lon, y: finishLine[0].lat };
  const fB = { x: finishLine[1].lon, y: finishLine[1].lat };
  const laps = [];
  let lapStart = 0;
  // 最低限のラップ時間（30秒）を入れて、フィニッシュ線スキム時の二重カウントを防ぐ
  const MIN_LAP_SEC = 30;
  for (let i = 1; i < samples.length; i++) {
    const a = samples[i-1], b = samples[i];
    if (isNaN(a.Lat) || isNaN(b.Lat)) continue;
    const p1 = { x: a.Lon, y: a.Lat };
    const p2 = { x: b.Lon, y: b.Lat };
    if (segmentsIntersect(p1, p2, fA, fB)) {
      const lapDuration = b.RunTime - samples[lapStart].RunTime;
      if (lapDuration >= MIN_LAP_SEC) {
        laps.push({ start: lapStart, end: i, t0: samples[lapStart].RunTime, t1: b.RunTime, durationSec: lapDuration });
        lapStart = i;
      }
    }
  }
  // 最後の不完全ラップは破棄（クールダウン区間想定）
  return laps;
};

// セルに該当するサンプルを抽出（地図ハイライト用）
const samplesInCell = (samples, rpmRange, tpsRange, rpmBins, tpsBins, ri, ti) => {
  const rpmStep = (rpmRange[1] - rpmRange[0]) / rpmBins;
  const tpsStep = (tpsRange[1] - tpsRange[0]) / tpsBins;
  const rpmLo = rpmRange[0] + ri * rpmStep, rpmHi = rpmLo + rpmStep;
  const tpsLo = tpsRange[0] + ti * tpsStep, tpsHi = tpsLo + tpsStep;
  return samples.filter(s =>
    s.Rpm >= rpmLo && s.Rpm < rpmHi &&
    s.Tps >= tpsLo && s.Tps < tpsHi &&
    !isNaN(s.Lat) && !isNaN(s.Lon)
  );
};

// ─── Fuel map cell binning ───────────────────────────────────
// Bins (RPM, TPS) samples into a 2D grid, computes per-cell AFR statistics.
// Default grid: 16 RPM bins × 16 TPS bins, matching typical aRacer fuel maps.
const computeFuelMapCells = (samples, rpmBins, tpsBins, rpmRange, tpsRange) => {
  const cells = [];
  for (let t = 0; t < tpsBins; t++) {
    const row = [];
    for (let r = 0; r < rpmBins; r++) row.push({ afrs: [], devs: [], count: 0 });
    cells.push(row);
  }
  const rpmStep = (rpmRange[1] - rpmRange[0]) / rpmBins;
  const tpsStep = (tpsRange[1] - tpsRange[0]) / tpsBins;

  for (const s of samples) {
    if (!s.Afr || s.Afr <= 5 || s.Afr > 25) continue;          // invalid AFR
    if (!s.Rpm || s.Rpm < rpmRange[0] || s.Rpm > rpmRange[1]) continue;
    if (s.Tps < tpsRange[0] || s.Tps > tpsRange[1]) continue;
    const ri = Math.min(rpmBins - 1, Math.floor((s.Rpm - rpmRange[0]) / rpmStep));
    const ti = Math.min(tpsBins - 1, Math.floor((s.Tps - tpsRange[0]) / tpsStep));
    cells[ti][ri].afrs.push(s.Afr);
    cells[ti][ri].count++;
    // 偏差サンプル：AfrTarget が有効値（5〜25 範囲内）の時のみ
    if (s.AfrTarget && s.AfrTarget > 5 && s.AfrTarget < 25) {
      cells[ti][ri].devs.push(s.Afr - s.AfrTarget);
    }
  }

  // Per-cell statistics
  for (const row of cells) {
    for (const cell of row) {
      if (cell.count === 0) continue;
      cell.afrs.sort((a, b) => a - b);
      cell.medianAfr = cell.afrs[Math.floor(cell.afrs.length / 2)];
      cell.minAfr = cell.afrs[0];
      cell.maxAfr = cell.afrs[cell.afrs.length - 1];
      const sum = cell.afrs.reduce((a, b) => a + b, 0);
      cell.meanAfr = sum / cell.afrs.length;
      // 偏差統計（target が取れているサンプルのみ集計）
      if (cell.devs.length > 0) {
        const devsSorted = [...cell.devs].sort((a, b) => a - b);
        cell.medianDev = devsSorted[Math.floor(devsSorted.length / 2)];
        cell.meanDev = cell.devs.reduce((a, b) => a + b, 0) / cell.devs.length;
        cell.devCount = cell.devs.length;
      } else {
        cell.medianDev = null;
        cell.meanDev = null;
        cell.devCount = 0;
      }
    }
  }
  return cells;
};

// ─── Stats summary across all cells ──────────────────────────
const computeMapStats = (cells) => {
  const target = AFR_TARGET;
  let total = 0, withData = 0, inTarget = 0, tooRich = 0, tooLean = 0;
  let maxCount = 0, busyCell = null;
  for (let ti = 0; ti < cells.length; ti++) {
    for (let ri = 0; ri < cells[ti].length; ri++) {
      const cell = cells[ti][ri];
      total++;
      if (cell.count === 0) continue;
      withData++;
      if (cell.medianAfr >= target.low && cell.medianAfr <= target.high) inTarget++;
      else if (cell.medianAfr < target.low) tooRich++;
      else if (cell.medianAfr > target.high) tooLean++;
      if (cell.count > maxCount) {
        maxCount = cell.count;
        busyCell = { ri, ti, count: cell.count, afr: cell.medianAfr };
      }
    }
  }
  return { total, withData, inTarget, tooRich, tooLean, maxCount, busyCell };
};

// ─── Helpers ─────────────────────────────────────────────────
const fmtNum = (n, d = 1) => n == null || isNaN(n) ? "—" : n.toFixed(d);
const fmtTime = (s) => {
  if (!s || s < 0) return "—";
  const m = Math.floor(s / 60), sec = (s % 60).toFixed(1).padStart(4, "0");
  return `${m}:${sec}`;
};

// File reader with FileReader fallback for older browsers
const readFileAsText = (file) => new Promise((resolve, reject) => {
  if (typeof file.text === "function") {
    file.text().then(resolve).catch(reject);
  } else {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("ファイル読み込みエラー"));
    reader.readAsText(file);
  }
});

// ─── Fuel map heatmap (the centerpiece) ──────────────────────
const FuelMapHeatmap = ({ cells, rpmRange, tpsRange, hoveredCell, setHoveredCell, colorMode = "afr" }) => {
  const tpsBins = cells.length;
  const rpmBins = cells[0]?.length || 0;
  if (!rpmBins) return null;

  const cellW = 50, cellH = 32;
  const padL = 60, padT = 14, padR = 14, padB = 36;
  const w = padL + rpmBins * cellW + padR;
  const h = padT + tpsBins * cellH + padB;

  const target = AFR_TARGET;

  // Cell renderer
  const cellEl = (cell, ri, ti) => {
    // aRacer SpeedTuning 公式の D3Cyl1_VM 等と同じ軸方向：
    //   横軸 = RPM（左→右に増加）、縦軸 = TPS（上→下に増加、低TPS が上）
    const x = padL + ri * cellW;
    const y = padT + ti * cellH;
    const isHover = hoveredCell && hoveredCell.ri === ri && hoveredCell.ti === ti;

    // 表示モードで色塗りと値表示を分岐
    let fill, displayVal, useLightText, hasData;
    if (colorMode === "dev") {
      hasData = cell.count > 0 && cell.devCount > 0 && cell.medianDev !== null;
      if (hasData) {
        fill = devColor(cell.medianDev);
        // 偏差は ±0.3 帯外で背景が濃くなるので、その範囲で白文字
        useLightText = Math.abs(cell.medianDev) > 1.2;
        displayVal = (cell.medianDev >= 0 ? "+" : "") + cell.medianDev.toFixed(2);
      } else {
        fill = COLORS.cell;
      }
    } else {
      hasData = cell.count > 0;
      if (hasData) {
        fill = afrColor(cell.medianAfr);
        useLightText = cell.medianAfr < 11.5 || cell.medianAfr > 15.5;
        displayVal = cell.medianAfr.toFixed(1);
      } else {
        fill = COLORS.cell;
      }
    }

    return (
      <g key={`${ri}-${ti}`}
         onMouseEnter={() => setHoveredCell({ cell, ri, ti })}
         onClick={() => setHoveredCell({ cell, ri, ti })}
         style={{ cursor: cell.count > 0 ? "pointer" : "default" }}>
        <rect x={x} y={y} width={cellW} height={cellH}
              fill={fill} stroke={isHover ? "var(--accent-bright)" : "#0a0a0d"}
              strokeWidth={isHover ? 2 : 0.5}
              className={isHover ? "cell-hot" : ""} />
        {hasData && (
          <>
            <text x={x + cellW / 2} y={y + cellH / 2 - 1}
                  textAnchor="middle" dominantBaseline="central"
                  fontSize={11} fontFamily="JetBrains Mono" fontWeight={600}
                  fill={useLightText ? "#fff" : "rgba(0,0,0,0.85)"}
                  pointerEvents="none">
              {displayVal}
            </text>
            <text x={x + cellW / 2} y={y + cellH / 2 + 9}
                  textAnchor="middle"
                  fontSize={7} fontFamily="JetBrains Mono"
                  fill={useLightText ? "rgba(255,255,255,0.55)" : "rgba(0,0,0,0.55)"}
                  pointerEvents="none">
              n={colorMode === "dev" ? cell.devCount : cell.count}
            </text>
          </>
        )}
      </g>
    );
  };

  // Axis labels
  // TPS は上から下に増加（aRacer SpeedTuning と同じ向き）
  const tpsLabels = [];
  for (let i = 0; i <= tpsBins; i++) {
    const tps = tpsRange[0] + i * (tpsRange[1] - tpsRange[0]) / tpsBins;
    tpsLabels.push(
      <text key={`ty${i}`} x={padL - 6} y={padT + i * cellH}
            textAnchor="end" dominantBaseline="middle"
            fontSize={9} fontFamily="JetBrains Mono" fill={COLORS.textDim}>
        {tps.toFixed(0)}%
      </text>
    );
  }
  const rpmLabels = [];
  for (let i = 0; i <= rpmBins; i++) {
    const rpm = rpmRange[0] + i * (rpmRange[1] - rpmRange[0]) / rpmBins;
    rpmLabels.push(
      <text key={`rx${i}`} x={padL + i * cellW} y={padT + tpsBins * cellH + 14}
            textAnchor="middle"
            fontSize={9} fontFamily="JetBrains Mono" fill={COLORS.textDim}>
        {rpm >= 1000 ? (rpm / 1000).toFixed(rpm % 1000 === 0 ? 0 : 1) + "k" : rpm.toFixed(0)}
      </text>
    );
  }

  return (
    <div className="p-3 overflow-x-auto" onMouseLeave={() => setHoveredCell(null)}>
      <svg viewBox={`0 0 ${w} ${h}`}
           preserveAspectRatio="xMinYMin meet"
           className="block"
           style={{ minWidth: w * 0.85, width: "100%", maxHeight: 600 }}>
        {/* Axis title: TPS */}
        <text x={14} y={padT + tpsBins * cellH / 2}
              textAnchor="middle"
              transform={`rotate(-90, 14, ${padT + tpsBins * cellH / 2})`}
              fontSize={10} fontFamily="JetBrains Mono"
              fill={COLORS.textMuted} letterSpacing="0.18em">
          THROTTLE %
        </text>
        {/* Axis title: RPM */}
        <text x={padL + rpmBins * cellW / 2} y={h - 4}
              textAnchor="middle"
              fontSize={10} fontFamily="JetBrains Mono"
              fill={COLORS.textMuted} letterSpacing="0.18em">
          RPM
        </text>
        {tpsLabels}
        {rpmLabels}
        {cells.flatMap((row, ti) => row.map((cell, ri) => cellEl(cell, ri, ti)))}
      </svg>
    </div>
  );
};

// ─── Colour legend with target band overlay (AFR / Dev) ──────
const AfrLegend = ({ colorMode = "afr" }) => {
  const w = 320, h = 50;
  const stops = 60;

  if (colorMode === "dev") {
    // 偏差モード: -3 〜 +3 のスケール、0 が target
    const devMin = DEV_DISPLAY_MIN, devMax = DEV_DISPLAY_MAX;
    const steps = [];
    for (let i = 0; i < stops; i++) {
      const t = i / (stops - 1);
      const dev = devMin + t * (devMax - devMin);
      steps.push({ x: (i * w) / stops, color: devColor(dev) });
    }
    const devX = (d) => ((d - devMin) / (devMax - devMin)) * w;
    return (
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ maxWidth: 360 }}>
        {steps.map((s, i) => (
          <rect key={i} x={s.x} y={6} width={w / stops + 0.5} height={14} fill={s.color} />
        ))}
        {/* 0 = target line */}
        <line x1={devX(0)} y1={3} x2={devX(0)} y2={23}
              stroke={COLORS.accentBright} strokeWidth={1.5} />
        {/* Tick labels */}
        {[-3, -2, -1, 0, 1, 2, 3].map((dev) => (
          <g key={dev}>
            <line x1={devX(dev)} y1={20} x2={devX(dev)} y2={26} stroke={COLORS.textMuted} strokeWidth={0.5} />
            <text x={devX(dev)} y={36} textAnchor="middle" fontSize={9} fontFamily="JetBrains Mono" fill={COLORS.textDim}>
              {dev > 0 ? `+${dev}` : `${dev}`}
            </text>
          </g>
        ))}
        {/* Direction hints: rich(safe) ← target → lean(danger) */}
        <text x={devX(-2)} y={48} textAnchor="middle" fontSize={8} fontFamily="JetBrains Mono"
              fill={COLORS.cool} letterSpacing="0.1em">
          ← RICH (safe)
        </text>
        <text x={devX(0)} y={48} textAnchor="middle" fontSize={8} fontFamily="JetBrains Mono"
              fill={COLORS.accent} letterSpacing="0.15em">
          TARGET
        </text>
        <text x={devX(2)} y={48} textAnchor="middle" fontSize={8} fontFamily="JetBrains Mono"
              fill={COLORS.danger} letterSpacing="0.1em">
          LEAN (danger) →
        </text>
      </svg>
    );
  }

  // AFR モード（既定）
  const target = AFR_TARGET;
  const steps = [];
  for (let i = 0; i < stops; i++) {
    const t = i / (stops - 1);
    const afr = AFR_DISPLAY_MIN + t * (AFR_DISPLAY_MAX - AFR_DISPLAY_MIN);
    steps.push({ x: (i * w) / stops, color: afrColor(afr) });
  }
  const targetX = (afr) => ((afr - AFR_DISPLAY_MIN) / (AFR_DISPLAY_MAX - AFR_DISPLAY_MIN)) * w;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ maxWidth: 360 }}>
      {steps.map((s, i) => (
        <rect key={i} x={s.x} y={6} width={w / stops + 0.5} height={14} fill={s.color} />
      ))}
      {/* Target band overlay */}
      <rect x={targetX(target.low)} y={3} width={targetX(target.high) - targetX(target.low)} height={20}
            fill="none" stroke={COLORS.accentBright} strokeWidth={1.2} />
      <line x1={targetX(target.mid)} y1={3} x2={targetX(target.mid)} y2={23}
            stroke={COLORS.accentBright} strokeWidth={1} />
      {/* Tick labels */}
      {[8, 10, 12, 13, 14.7, 17, 18].map((afr) => (
        <g key={afr}>
          <line x1={targetX(afr)} y1={20} x2={targetX(afr)} y2={26} stroke={COLORS.textMuted} strokeWidth={0.5} />
          <text x={targetX(afr)} y={36} textAnchor="middle" fontSize={9} fontFamily="JetBrains Mono" fill={COLORS.textDim}>
            {afr}
          </text>
        </g>
      ))}
      {/* Direction hints: rich(safe) ← target → lean(danger) */}
      <text x={targetX(9)} y={48} textAnchor="middle" fontSize={8} fontFamily="JetBrains Mono"
            fill={COLORS.cool} letterSpacing="0.1em">
        ← RICH (safe)
      </text>
      <text x={targetX(target.mid)} y={48} textAnchor="middle" fontSize={8} fontFamily="JetBrains Mono"
            fill={COLORS.accent} letterSpacing="0.15em">
        TARGET
      </text>
      <text x={targetX(17)} y={48} textAnchor="middle" fontSize={8} fontFamily="JetBrains Mono"
            fill={COLORS.danger} letterSpacing="0.1em">
        LEAN (danger) →
      </text>
    </svg>
  );
};

// ─── Cell detail readout ─────────────────────────────────────
const CellDetail = ({ hovered, rpmRange, tpsRange, rpmBins, tpsBins }) => {
  if (!hovered) {
    return (
      <div className="p-3 font-mono text-[10px]" style={{ color: COLORS.textMuted }}>
        セルをタップ／ホバーすると詳細が表示されます
      </div>
    );
  }
  const { cell, ri, ti } = hovered;
  const rpmLo = rpmRange[0] + ri * (rpmRange[1] - rpmRange[0]) / rpmBins;
  const rpmHi = rpmRange[0] + (ri + 1) * (rpmRange[1] - rpmRange[0]) / rpmBins;
  const tpsLo = tpsRange[0] + ti * (tpsRange[1] - tpsRange[0]) / tpsBins;
  const tpsHi = tpsRange[0] + (ti + 1) * (tpsRange[1] - tpsRange[0]) / tpsBins;
  const target = AFR_TARGET;

  // Status色：リッチ=安全(青), リーン=危険(赤), 目標帯域内=緑（aRacer/HONDA慣例）
  let band = "—", bandColor = COLORS.textMuted;
  if (cell.count > 0) {
    if (cell.medianAfr < target.low) { band = "RICH"; bandColor = COLORS.cool; }
    else if (cell.medianAfr > target.high) { band = "LEAN"; bandColor = COLORS.danger; }
    else { band = "TARGET"; bandColor = COLORS.target; }
  }

  return (
    <div className="p-3 grid grid-cols-2 gap-x-4 gap-y-2">
      <div>
        <div className="font-mono text-[9px] uppercase tracking-[0.2em]" style={{ color: COLORS.textMuted }}>RPM Cell</div>
        <div className="font-mono text-sm tnum">{rpmLo.toFixed(0)} - {rpmHi.toFixed(0)}</div>
      </div>
      <div>
        <div className="font-mono text-[9px] uppercase tracking-[0.2em]" style={{ color: COLORS.textMuted }}>TPS Cell</div>
        <div className="font-mono text-sm tnum">{tpsLo.toFixed(0)} - {tpsHi.toFixed(0)} %</div>
      </div>
      {cell.count > 0 ? (
        <>
          <div>
            <div className="font-mono text-[9px] uppercase tracking-[0.2em]" style={{ color: COLORS.textMuted }}>AFR median</div>
            <div className="font-mono text-2xl tnum" style={{ color: bandColor }}>{cell.medianAfr.toFixed(2)}</div>
          </div>
          <div>
            <div className="font-mono text-[9px] uppercase tracking-[0.2em]" style={{ color: COLORS.textMuted }}>Status</div>
            <div className="font-mono text-sm" style={{ color: bandColor }}>{band}</div>
          </div>
          <div>
            <div className="font-mono text-[9px] uppercase tracking-[0.2em]" style={{ color: COLORS.textMuted }}>Range</div>
            <div className="font-mono text-xs tnum">{cell.minAfr.toFixed(2)} ~ {cell.maxAfr.toFixed(2)}</div>
          </div>
          <div>
            <div className="font-mono text-[9px] uppercase tracking-[0.2em]" style={{ color: COLORS.textMuted }}>Samples</div>
            <div className="font-mono text-sm tnum">{cell.count}</div>
          </div>
        </>
      ) : (
        <div className="col-span-2">
          <div className="font-mono text-[10px]" style={{ color: COLORS.textMuted }}>このセルにはデータが乗っていません（実走で通っていない RPM × TPS の組み合わせ）</div>
        </div>
      )}
    </div>
  );
};

// ─── Lap filter (chooses which laps go into the map) ──────────
const LapFilter = ({ samples, lapFilter, setLapFilter }) => {
  // Group samples by Lap, compute lap durations
  const laps = useMemo(() => {
    const m = new Map();
    for (const s of samples) {
      if (!m.has(s.Lap)) m.set(s.Lap, { lap: s.Lap, n: 0, t0: s.RunTime, t1: s.RunTime });
      const e = m.get(s.Lap);
      e.n++;
      e.t1 = s.RunTime;
    }
    return [...m.values()].sort((a, b) => a.lap - b.lap);
  }, [samples]);

  if (laps.length <= 1) return null;

  return (
    <div className="p-3">
      <div className="flex flex-wrap gap-1.5">
        <button onClick={() => setLapFilter(new Set())}
                className={`font-mono text-[10px] uppercase tracking-wider px-2 py-1 transition`}
                style={{
                  background: lapFilter.size === 0 ? COLORS.accent : "transparent",
                  color: lapFilter.size === 0 ? "#000" : COLORS.textDim,
                  border: `1px solid ${lapFilter.size === 0 ? COLORS.accent : COLORS.border}`,
                }}>
          ALL
        </button>
        {laps.map((l) => {
          const dur = l.t1 - l.t0;
          const active = lapFilter.has(l.lap);
          return (
            <button key={l.lap}
                    onClick={() => {
                      const next = new Set(lapFilter);
                      if (next.has(l.lap)) next.delete(l.lap); else next.add(l.lap);
                      setLapFilter(next);
                    }}
                    className="font-mono text-[10px] uppercase tracking-wider px-2 py-1 transition"
                    style={{
                      background: active ? COLORS.accent : "transparent",
                      color: active ? "#000" : COLORS.textDim,
                      border: `1px solid ${active ? COLORS.accent : COLORS.border}`,
                    }}>
            L{l.lap} · {fmtTime(dur)}
            </button>
          );
        })}
      </div>
    </div>
  );
};

// ─── Track View (Phase 2: GPS 位置 × AFR の地図) ─────────────
const TrackView = ({ samples, circuitDetection, hoveredCell, rpmRange, tpsRange, rpmBins, tpsBins, onSelectFromMap, colorMode = "afr", leanSpots = null, showLeanSpots = false }) => {
  const mapDivRef = useRef(null);
  const mapRef = useRef(null);
  const layersRef = useRef({ track: null, highlight: null, finishLine: null, currentMarker: null });
  const [leafletStatus, setLeafletStatus] = useState(
    typeof window !== "undefined" && window.L ? "ready" : "loading"
  );
  const [initError, setInitError] = useState(null);
  const [renderStats, setRenderStats] = useState({ valid: 0, segments: 0, afrColored: 0, gray: 0, rendered: false });

  // Leaflet ロード待機
  useEffect(() => {
    if (leafletStatus === "ready") return;
    const start = Date.now();
    const tick = () => {
      if (window.L) { setLeafletStatus("ready"); return; }
      if (Date.now() - start > 10000) { setLeafletStatus("failed"); return; }
      setTimeout(tick, 150);
    };
    tick();
  }, [leafletStatus]);

  // 地図初期化
  useEffect(() => {
    if (leafletStatus !== "ready" || !mapDivRef.current || mapRef.current) return;
    try {
      const map = window.L.map(mapDivRef.current, {
        zoomControl: true,
        attributionControl: true,
      });
      window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap',
      }).addTo(map);
      mapRef.current = map;
      setTimeout(() => { try { map.invalidateSize(); } catch(e){} }, 100);
    } catch (e) {
      console.error("[aRacer Lab] Leaflet init failed:", e);
      setInitError(e.message || String(e));
      return;
    }
    return () => {
      try { mapRef.current?.remove(); } catch(e) {}
      mapRef.current = null;
    };
  }, [leafletStatus]);

  // GPSライン描画（AFR色塗り）
  useEffect(() => {
    const map = mapRef.current;
    if (!map || samples.length === 0) return;
    try {
      // 既存レイヤをクリア（配列で管理する方式に変更）
      if (Array.isArray(layersRef.current.track)) {
        layersRef.current.track.forEach(l => { try { map.removeLayer(l); } catch(e){} });
        layersRef.current.track = null;
      }
      if (layersRef.current.finishLine) { try { map.removeLayer(layersRef.current.finishLine); } catch(e){} layersRef.current.finishLine = null; }

      const validSamples = samples.filter(s => Number.isFinite(s.Lat) && Number.isFinite(s.Lon));
      console.log("[aRacer Lab] GPS samples valid/total:", validSamples.length, "/", samples.length);
      if (validSamples.length < 2) {
        setRenderStats({ valid: validSamples.length, segments: 0, afrColored: 0, gray: 0, rendered: false });
        return;
      }

      // 最大 1500 セグメントに間引き
      const TARGET_SEGMENTS = 1500;
      const stride = Math.max(1, Math.floor(validSamples.length / TARGET_SEGMENTS));

      // 全レイヤを直接 map に追加し、配列で管理（FeatureGroup を経由しない）
      const allLayers = [];

      // 1) ベースライン：bounds 計算と「最低限の視認」を担保するためのオレンジ太線
      const baseCoords = [];
      for (let i = 0; i < validSamples.length; i += stride) {
        baseCoords.push([validSamples[i].Lat, validSamples[i].Lon]);
      }
      let baseLine = null;
      if (baseCoords.length >= 2) {
        baseLine = window.L.polyline(baseCoords, {
          color: "#fb923c",
          weight: 6,
          opacity: 0.55,
          lineCap: "round",
          lineJoin: "round",
        });
        baseLine.addTo(map);
        allLayers.push(baseLine);
      }

      // 2) AFR / 偏差 の色塗りセグメント（無効AFRは灰色で必ず描く）
      let afrColored = 0, gray = 0;
      for (let i = stride; i < validSamples.length; i += stride) {
        const a = validSamples[i - stride];
        const b = validSamples[i];
        const avgAfr = (a.Afr + b.Afr) / 2;
        let color, isAfr = false;
        if (colorMode === "dev") {
          // 偏差モード: WBO2 − Target の平均で色塗り
          const aDev = (a.AfrTarget && a.AfrTarget > 5 && a.AfrTarget < 25 && a.Afr > 5 && a.Afr < 25)
                       ? a.Afr - a.AfrTarget : null;
          const bDev = (b.AfrTarget && b.AfrTarget > 5 && b.AfrTarget < 25 && b.Afr > 5 && b.Afr < 25)
                       ? b.Afr - b.AfrTarget : null;
          if (aDev !== null && bDev !== null) {
            const avgDev = (aDev + bDev) / 2;
            const devCol = devColor(avgDev);
            if (devCol) { color = devCol; isAfr = true; }
            else color = "#666";
          } else {
            color = "#666"; // ターゲット欠損
          }
        } else {
          // AFR 実測モード（既定）
          if (avgAfr > 5 && avgAfr < 25) {
            const afrCol = afrColor(avgAfr);
            if (afrCol) { color = afrCol; isAfr = true; }
            else color = "#666";
          } else {
            color = "#666"; // AFR データなし／無効
          }
        }
        const seg = window.L.polyline([[a.Lat, a.Lon], [b.Lat, b.Lon]], {
          color: color,
          weight: 4,
          opacity: 1,
          lineCap: "round",
        });
        seg.addTo(map);
        allLayers.push(seg);
        if (isAfr) afrColored++; else gray++;
      }

      layersRef.current.track = allLayers;
      console.log("[aRacer Lab] segments rendered: AFR=" + afrColored + " gray=" + gray + " base=" + (baseLine ? 1 : 0));

      // フィニッシュライン
      if (circuitDetection?.circuit) {
        const fl = circuitDetection.circuit.finishLine;
        const finishLine = window.L.polyline(
          [[fl[0].lat, fl[0].lon], [fl[1].lat, fl[1].lon]],
          { color: "#facc15", weight: 6, opacity: 1, dashArray: "8,5" }
        ).bindTooltip("FINISH LINE", { permanent: false, direction: "top" });
        finishLine.addTo(map);
        layersRef.current.finishLine = finishLine;
      }

      // ビューを走行軌跡にフィット
      try {
        // baseLine の bounds を直接使う（FeatureGroup より確実）
        if (baseLine) {
          map.invalidateSize();
          const bounds = baseLine.getBounds();
          if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] });
        }
      } catch(e) { console.warn("fitBounds failed:", e); }

      setRenderStats({ valid: validSamples.length, segments: afrColored + gray, afrColored, gray, rendered: true });

      // クリックでセル選択
      const clickHandler = (e) => {
        const click = e.latlng;
        let best = null, bestD = Infinity;
        for (const s of validSamples) {
          const d = (s.Lat - click.lat) ** 2 + (s.Lon - click.lng) ** 2;
          if (d < bestD) { bestD = d; best = s; }
        }
        if (best && onSelectFromMap) onSelectFromMap(best);
      };
      map.on("click", clickHandler);
      return () => { try { map.off("click", clickHandler); } catch(e){} };
    } catch (e) {
      console.error("[aRacer Lab] Track render failed:", e);
      setRenderStats({ valid: 0, segments: 0, afrColored: 0, gray: 0, rendered: false });
    }
  }, [leafletStatus, samples, circuitDetection, onSelectFromMap, colorMode]);

  // リーンスポット描画（toggle ON 時のみ）
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    try {
      // 既存のリーンスポット層を一旦クリア
      if (layersRef.current.leanSpots) {
        for (const m of layersRef.current.leanSpots) {
          try { map.removeLayer(m); } catch(e) {}
        }
        layersRef.current.leanSpots = null;
      }
      if (!showLeanSpots || !leanSpots || leanSpots.total === 0) return;

      // 重要度順（danger > warning > caution）で上限 500 点まで描画
      const ordered = [
        ...leanSpots.danger.map(s => ({...s, level: "danger"})),
        ...leanSpots.warning.map(s => ({...s, level: "warning"})),
        ...leanSpots.caution.map(s => ({...s, level: "caution"})),
      ];
      const capped = ordered.slice(0, LEAN_SPOT_MAX_MARKERS);

      const markers = [];
      for (const s of capped) {
        const cfg = LEAN_SPOT_THRESHOLDS[s.level];
        // 燃料カット中の点は「ゴースト」表示：fillOpacity 大幅減・サイズ縮小
        // 燃料カット OFF の点は強表示：燃焼中に薄い = 実害候補
        const fc = !!s.fuelCut;
        const m = window.L.circleMarker([s.lat, s.lon], {
          radius:      fc ? Math.max(2, cfg.radius - 2) : cfg.radius,
          color:       fc ? cfg.color : "#000",
          weight:      fc ? 1 : 1,
          opacity:     fc ? 0.55 : 0.85,
          fillColor:   cfg.color,
          fillOpacity: fc ? 0.18 : 0.92,
        }).bindTooltip(
          `${cfg.label}${fc ? " (FC中・燃焼なし)" : ""} · AFR ${s.afr.toFixed(1)} · RPM ${Math.round(s.rpm)} · TPS ${Math.round(s.tps)}%`,
          { direction: "top", offset: [0, -2] }
        );
        m.addTo(map);
        markers.push(m);
      }
      layersRef.current.leanSpots = markers;
      console.log("[aRacer Lab] lean spots rendered: " + markers.length + " / " + leanSpots.total + " (danger=" + leanSpots.danger.length + "(real=" + leanSpots.dangerReal + ",FC=" + leanSpots.dangerFC + ") warning=" + leanSpots.warning.length + " caution=" + leanSpots.caution.length + ")");
    } catch (e) {
      console.error("[aRacer Lab] Lean spot render failed:", e);
    }
  }, [leafletStatus, showLeanSpots, leanSpots]);

  // セル選択時のハイライト
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    try {
      if (layersRef.current.highlight) {
        map.removeLayer(layersRef.current.highlight);
        layersRef.current.highlight = null;
      }
      if (!hoveredCell) return;
      const matched = samplesInCell(samples, rpmRange, tpsRange, rpmBins, tpsBins, hoveredCell.ri, hoveredCell.ti);
      if (matched.length === 0) return;
      const highlight = window.L.featureGroup();
      for (const s of matched) {
        window.L.circleMarker([s.Lat, s.Lon], {
          radius: 6,
          color: "#fff",
          weight: 2,
          opacity: 1,
          fillColor: "#fb923c",
          fillOpacity: 0.95,
        }).addTo(highlight);
      }
      highlight.addTo(map);
      layersRef.current.highlight = highlight;
    } catch (e) {
      console.error("[aRacer Lab] Highlight render failed:", e);
    }
  }, [leafletStatus, hoveredCell, samples, rpmRange, tpsRange, rpmBins, tpsBins]);

  return (
    <div className="relative">
      <div ref={mapDivRef} style={{ height: 520, background: "#0a0c10" }} />
      {/* ロード/エラーオーバーレイ */}
      {leafletStatus === "loading" && (
        <div className="absolute inset-0 flex items-center justify-center font-mono text-xs"
             style={{ color: COLORS.textMuted, background: "rgba(10,12,16,0.6)" }}>
          地図ライブラリ読み込み中...
        </div>
      )}
      {leafletStatus === "failed" && (
        <div className="absolute inset-0 flex items-center justify-center font-mono text-xs px-4 text-center"
             style={{ color: COLORS.danger, background: "rgba(10,12,16,0.85)" }}>
          地図ライブラリ（Leaflet）の読み込みに失敗しました。<br/>
          ネットワーク・ad-blocker をご確認ください。<br/>
          ヒートマップ機能は通常通り使用できます。
        </div>
      )}
      {initError && (
        <div className="absolute inset-0 flex items-center justify-center font-mono text-xs px-4 text-center"
             style={{ color: COLORS.danger, background: "rgba(10,12,16,0.85)" }}>
          地図初期化エラー: {initError}
        </div>
      )}
      {leafletStatus === "ready" && circuitDetection?.circuit && (
        <div className="absolute top-2 right-2 px-2 py-1 z-[400] font-mono text-[10px] uppercase tracking-wider"
             style={{ background: "rgba(15,17,21,0.92)", color: COLORS.accent, border: `1px solid ${COLORS.borderBright}` }}>
          {circuitDetection.circuit.name}
        </div>
      )}
      {leafletStatus === "ready" && !circuitDetection && samples.length > 0 && (
        <div className="absolute top-2 right-2 px-2 py-1 z-[400] font-mono text-[10px] uppercase tracking-wider"
             style={{ background: "rgba(15,17,21,0.92)", color: COLORS.textMuted, border: `1px solid ${COLORS.border}` }}>
          サーキット未登録 / GPS 範囲外
        </div>
      )}
      {/* 描画ステータス（デバッグ・確認用） */}
      {leafletStatus === "ready" && samples.length > 0 && (
        <div className="absolute top-2 left-2 px-2 py-1 z-[400] font-mono text-[10px]"
             style={{ background: "rgba(15,17,21,0.92)",
                      color: renderStats.rendered ? COLORS.target : COLORS.danger,
                      border: `1px solid ${renderStats.rendered ? COLORS.target : COLORS.danger}` }}>
          {renderStats.rendered
            ? `✓ AFR色 ${renderStats.afrColored} / 灰 ${renderStats.gray} + base 1 · GPS ${renderStats.valid} pts`
            : `⚠ 描画失敗: GPS ${renderStats.valid} pts`}
        </div>
      )}
      {/* AFR連携の説明バナー（左下） */}
      {leafletStatus === "ready" && samples.length > 0 && (
        <div className="absolute bottom-2 left-2 px-2 py-1.5 z-[400] font-mono text-[10px] leading-tight"
             style={{ background: "rgba(15,17,21,0.92)", color: COLORS.textDim, border: `1px solid ${COLORS.border}`, maxWidth: 280 }}>
          <div style={{ color: COLORS.accent, marginBottom: 2 }}>▸ AFR連携</div>
          ベース線=オレンジ、AFR色塗り=<span style={{ color: COLORS.cool }}>青(濃)</span>/<span style={{ color: COLORS.target }}>緑(目標)</span>/<span style={{ color: COLORS.danger }}>赤(薄)</span><br/>
          ヒートマップでセル選択→該当区間がオレンジ円で強調<br/>
          地図クリック→最寄り点をヒートマップでハイライト
        </div>
      )}
    </div>
  );
};

// ─── Main app ────────────────────────────────────────────────
const App = () => {
  const [session, setSession] = useState(null);
  const [parseError, setParseError] = useState(null);
  const [rpmBins, setRpmBins] = useState(16);
  const [tpsBins, setTpsBins] = useState(16);
  const [rpmRange, setRpmRange] = useState([1000, 14000]);
  const [tpsRange, setTpsRange] = useState([0, 100]);
  const [autoRange, setAutoRange] = useState(true);
  const [lapFilter, setLapFilter] = useState(new Set());
  const [hoveredCell, setHoveredCell] = useState(null);
  const [aboutOpen, setAboutOpen] = useState(false);
  const [viewMode, setViewMode] = useState("heatmap"); // "heatmap" | "track"
  const [colorMode, setColorMode] = useState("afr"); // "afr"（実測値） | "dev"（WBO2-Target 偏差）
  const [showLeanSpots, setShowLeanSpots] = useState(false); // Track Map にリーンスポット赤丸を重ね表示
  const fileInputRef = useRef(null);

  // Auto-adjust RPM range when a new file is loaded
  useEffect(() => {
    if (!session || !autoRange) return;
    const rpms = session.data.map(d => d.Rpm).filter(r => r > 200);
    if (!rpms.length) return;
    const maxRpm = Math.max(...rpms);
    const ceiling = Math.ceil((maxRpm + 500) / 1000) * 1000;
    setRpmRange([1000, Math.max(8000, Math.min(20000, ceiling))]);
  }, [session, autoRange]);

  const handleFile = useCallback(async (file) => {
    setParseError(null);
    try {
      const text = await readFileAsText(file);
      const fmt = detectLogFormat(text);
      if (fmt !== "aracer_sp" && fmt !== "aracer_ecu" && fmt !== "aracer_lm") {
        setParseError(`${file.name}: aRacer .loga 形式ではありません`);
        return;
      }
      const { data, format, sampleStride, totalRows, hasValidGps, gpsValidCount } = parseAracerLog(text, fmt);
      if (!data.length) {
        setParseError(`${file.name}: データ行が空です`);
        return;
      }
      // Detect data quality
      const validAfr = data.filter(d => d.Afr > 5 && d.Afr < 25).length;
      const validRpm = data.filter(d => d.Rpm > 200).length;
      const validTps = data.filter(d => d.Tps >= 0).length;

      if (validAfr === 0) {
        setParseError(`${file.name}: 有効な AFR データがありません（センサー未接続？）`);
        return;
      }

      // GPS が取れていればサーキット自動判定とラップ自動分割
      let circuitDetection = null;
      let autoLaps = [];
      if (hasValidGps) {
        circuitDetection = detectCircuit(data);
        if (circuitDetection?.circuit?.finishLine) {
          autoLaps = detectLapsByFinishLine(data, circuitDetection.circuit.finishLine);
          // autoLaps を data の Lap フィールドへ反映（IR_LapNumber が無いログでもラップフィルタが効くように）
          if (autoLaps.length > 0) {
            // 各ラップの範囲を Lap=1, 2, ... と振り直す（既存 IR_LapNumber は上書き）
            for (let lapI = 0; lapI < autoLaps.length; lapI++) {
              for (let i = autoLaps[lapI].start; i < autoLaps[lapI].end; i++) {
                data[i].Lap = lapI + 1;
              }
            }
          }
        }
      }

      setSession({
        name: file.name.replace(/\.loga$/i, ""),
        format,
        data,
        sampleStride,
        totalRows,
        hasValidGps,
        gpsValidCount,
        circuitDetection,
        autoLaps,
        stats: {
          validAfr, validRpm, validTps,
          duration: data[data.length - 1].RunTime - data[0].RunTime,
        },
      });
      setLapFilter(new Set());
      setHoveredCell(null);
      // GPS 有りなら最初は track ビューを見せる方が新ユーザーに価値が伝わりやすい
      // ...と思ったが、ヒートマップが本筋なのでデフォルトはヒートマップ維持
    } catch (e) {
      setParseError(`${file.name}: ${e.message}`);
    }
  }, []);

  // Filter samples by lap selection
  const filteredSamples = useMemo(() => {
    if (!session) return [];
    if (lapFilter.size === 0) return session.data;
    return session.data.filter(d => lapFilter.has(d.Lap));
  }, [session, lapFilter]);

  // Compute fuel map cells
  const cells = useMemo(() => {
    return computeFuelMapCells(filteredSamples, rpmBins, tpsBins, rpmRange, tpsRange);
  }, [filteredSamples, rpmBins, tpsBins, rpmRange, tpsRange]);

  const stats = useMemo(() => computeMapStats(cells), [cells]);

  // リーンスポット集計（Track Map に重ね表示・count バッジで使用）
  const leanSpots = useMemo(() => computeLeanSpots(filteredSamples), [filteredSamples]);

  // 地図クリック → 該当セルをヒートマップ側でハイライト
  const handleSelectFromMap = useCallback((sample) => {
    if (!sample) return;
    const rpmStep = (rpmRange[1] - rpmRange[0]) / rpmBins;
    const tpsStep = (tpsRange[1] - tpsRange[0]) / tpsBins;
    const ri = Math.floor((sample.Rpm - rpmRange[0]) / rpmStep);
    const ti = Math.floor((sample.Tps - tpsRange[0]) / tpsStep);
    if (ri < 0 || ri >= rpmBins || ti < 0 || ti >= tpsBins) return;
    const cell = cells[ti]?.[ri];
    if (!cell) return;
    setHoveredCell({ cell, ri, ti });
    // モバイル時のみヒートマップに自動切替（デスクトップは地図側を見続けたい想定）
    if (window.innerWidth < 1024) setViewMode("heatmap");
  }, [cells, rpmRange, tpsRange, rpmBins, tpsBins]);

  // ─── Render ───────────────────────────────────────────────
  const sourceLabel = {
    aracer_sp:  { short: "SP",  full: "aRacer App (smartphone)" },
    aracer_ecu: { short: "ECU", full: "ECU Memory" },
    aracer_lm:  { short: "LM",  full: "Logger Module" },
  };
  const srcInfo = session ? sourceLabel[session.format] : null;

  return (
    <div className="min-h-screen relative">
      {/* Header */}
      <header className="px-4 sm:px-5 py-3 flex flex-wrap items-center gap-3 justify-between" style={{ background: COLORS.panel, borderBottom: `1px solid ${COLORS.border}` }}>
        <div className="flex items-center gap-3">
          <div style={{ width: 4, height: 28, background: COLORS.accent }} />
          <div>
            <div className="font-mono uppercase tracking-[0.32em] text-base font-semibold" style={{ color: COLORS.text }}>
              <span style={{ color: COLORS.accent }}>aRacer</span> // LAB
            </div>
            <div className="font-mono text-[9px] uppercase tracking-[0.25em] mt-0.5" style={{ color: COLORS.textMuted }}>
              FUEL MAP STUDIO · v{APP_VERSION}
            </div>
          </div>
        </div>
        <div className="flex items-center gap-2 sm:gap-3 flex-wrap">
          {/* About */}
          <button onClick={() => setAboutOpen(true)}
                  className="font-mono text-[10px] uppercase tracking-wider px-2 py-1.5 transition hover:text-white"
                  style={{ color: COLORS.textDim, border: `1px solid ${COLORS.border}` }}>
            ?
          </button>
          {/* File load */}
          <input ref={fileInputRef} type="file" accept=".loga,text/plain"
                 className="hidden"
                 onChange={(e) => { if (e.target.files?.[0]) handleFile(e.target.files[0]); }} />
          <button onClick={() => fileInputRef.current?.click()}
                  className="font-mono uppercase tracking-wider px-3 py-1.5 transition"
                  style={{ background: COLORS.accent, color: "#000", fontSize: 11 }}>
            ↑ LOAD .loga
          </button>
        </div>
      </header>

      {/* Empty / error state */}
      {!session && (
        <main className="p-4 sm:p-8 max-w-3xl mx-auto">
          {/* What is this for? */}
          <div className="mb-4 p-4 sm:p-5" style={{ background: COLORS.panel, border: `1px solid ${COLORS.border}` }}>
            <div className="font-mono text-[10px] uppercase tracking-[0.25em] mb-2" style={{ color: COLORS.accent }}>
              ▸ このツールの目的
            </div>
            <div className="text-sm space-y-2" style={{ color: COLORS.textDim }}>
              <p>aRacer システムで走った後の <code className="font-mono text-xs px-1" style={{ background: COLORS.cell, color: COLORS.accent }}>.loga</code> ログを読み、<strong style={{ color: COLORS.text }}>実走時の AFR がどこで濃すぎ／薄すぎたかを特定する</strong>診断ツール。SpeedTuning で燃料マップを修正する前段階で使う。</p>
              <div className="font-mono text-[11px] mt-3 px-3 py-2" style={{ background: COLORS.cell, color: COLORS.textMuted }}>
                走行 → .loga 出力 → <span style={{ color: COLORS.accent }}>[ここで診断]</span> → SpeedTuning で修正 → 走行で検証
              </div>
            </div>
          </div>

          {/* How to use? */}
          <div className="mb-4 p-4 sm:p-5" style={{ background: COLORS.panel, border: `1px solid ${COLORS.border}` }}>
            <div className="font-mono text-[10px] uppercase tracking-[0.25em] mb-3" style={{ color: COLORS.accent }}>
              ▸ 操作の流れ
            </div>
            <ol className="text-sm space-y-1.5 pl-1" style={{ color: COLORS.textDim }}>
              <li><span className="font-mono text-[10px] mr-2" style={{ color: COLORS.accent }}>01</span>下のエリアに <code className="font-mono text-xs px-1" style={{ background: COLORS.cell, color: COLORS.accent }}>.loga</code> をドロップ、または ↑LOAD ボタンで開く</li>
              <li><span className="font-mono text-[10px] mr-2" style={{ color: COLORS.accent }}>02</span>ヒートマップで <span style={{ color: COLORS.danger }}>赤いセル（リーン＝危険）</span>を最優先、続いて <span style={{ color: COLORS.cool }}>濃すぎる青</span>を探す</li>
              <li><span className="font-mono text-[10px] mr-2" style={{ color: COLORS.accent }}>03</span>気になるセルをタップ／ホバー → <strong style={{ color: COLORS.accent }}>Track Map タブ</strong>に切り替えて、それがサーキット上のどこで起きたかを確認</li>
              <li><span className="font-mono text-[10px] mr-2" style={{ color: COLORS.accent }}>04</span>SpeedTuning 側で対応セルの燃料補正を調整</li>
            </ol>
            <div className="mt-3 px-3 py-2 font-mono text-[10px]" style={{ background: COLORS.cell, color: COLORS.textMuted }}>
              Track Map は GPS データがあるログ（Logger Module / RFM2.5 装着 ECU）でのみ有効。サーキット位置から自動で筑波・もてぎを判定します。
            </div>
          </div>

          {/* Drop zone */}
          <div className="text-center py-12 sm:py-14 scanlines relative" style={{ background: COLORS.panel, border: `1px dashed ${COLORS.border}` }}
               onDragOver={(e) => e.preventDefault()}
               onDrop={(e) => { e.preventDefault(); if (e.dataTransfer.files?.[0]) handleFile(e.dataTransfer.files[0]); }}>
            <div className="font-mono uppercase tracking-[0.3em] text-xs mb-3" style={{ color: COLORS.accent }}>
              READY · NO LOG LOADED
            </div>
            <div className="text-sm mb-6 px-4" style={{ color: COLORS.textDim }}>
              <code className="font-mono text-xs px-1" style={{ background: COLORS.cell, color: COLORS.accent }}>.loga</code> をドラッグ＆ドロップ、または ↑LOAD ボタンで開く
            </div>
            <div className="font-mono text-[10px] space-y-1" style={{ color: COLORS.textMuted }}>
              <div>SUPPORTED FORMATS</div>
              <div>SP（Smartアプリ） · ECU（メモリエクスポート） · LM（Logger Module）</div>
            </div>
          </div>
          {parseError && (
            <div className="mt-4 px-4 py-3 font-mono text-xs"
                 style={{ background: "rgba(239,68,68,0.1)", border: `1px solid ${COLORS.danger}`, color: COLORS.danger }}>
              ! {parseError}
            </div>
          )}
        </main>
      )}

      {session && (
        <main className="p-3 sm:p-4 grid gap-3 lg:grid-cols-[minmax(0,1fr)_320px]">
          {/* LEFT — main column */}
          <div className="space-y-3">
            {/* Session info */}
            <Panel title="Session" accent>
              <div className="px-3 py-2.5 flex items-center justify-between gap-3 flex-wrap">
                <div className="flex items-center gap-2 min-w-0">
                  <div className="font-mono text-sm truncate" style={{ color: COLORS.text }}>{session.name}</div>
                  {srcInfo && (
                    <span className="font-mono text-[9px] px-1.5 py-0.5 flex-shrink-0"
                          style={{ background: "rgba(251,146,60,0.18)", color: COLORS.accent, border: `1px solid ${COLORS.accent}` }}>
                      aR-{srcInfo.short}
                    </span>
                  )}
                  <span className="font-mono text-[10px]" style={{ color: COLORS.textMuted }}>
                    · {fmtTime(session.stats.duration)}
                    · {session.data.length.toLocaleString()} samples
                    {session.sampleStride > 1 && ` (1/${session.sampleStride} downsampled)`}
                  </span>
                </div>
                <div className="font-mono text-[10px] flex items-center gap-3" style={{ color: COLORS.textMuted }}>
                  <span>AFR: <span style={{ color: COLORS.text }}>{session.stats.validAfr.toLocaleString()}</span></span>
                  <span>RPM: <span style={{ color: COLORS.text }}>{session.stats.validRpm.toLocaleString()}</span></span>
                  <span>TPS: <span style={{ color: COLORS.text }}>{session.stats.validTps.toLocaleString()}</span></span>
                </div>
              </div>
            </Panel>

            {/* Lap filter (if applicable) */}
            {filteredSamples.length > 0 && session.data.some(d => d.Lap > 0) && (
              <Panel title="Lap filter" accent>
                <LapFilter samples={session.data} lapFilter={lapFilter} setLapFilter={setLapFilter} />
              </Panel>
            )}

            {/* View toggle: Heatmap / Track */}
            <Panel title="View" accent
                   actions={
                     <div className="flex items-center gap-3 flex-wrap justify-end font-mono text-[10px]">
                       {/* Color mode toggle: AFR 実測 / 偏差 (WBO2-Target) */}
                       <div className="flex items-center gap-1">
                         <span style={{ color: COLORS.textMuted }}>色:</span>
                         <button onClick={() => setColorMode("afr")}
                                 style={{
                                   color: colorMode === "afr" ? COLORS.accent : COLORS.textMuted,
                                   fontWeight: colorMode === "afr" ? "bold" : "normal",
                                   textDecoration: colorMode === "afr" ? "underline" : "none",
                                 }}>AFR</button>
                         <span style={{ color: COLORS.textMuted }}>/</span>
                         <button onClick={() => setColorMode("dev")}
                                 style={{
                                   color: colorMode === "dev" ? COLORS.accent : COLORS.textMuted,
                                   fontWeight: colorMode === "dev" ? "bold" : "normal",
                                   textDecoration: colorMode === "dev" ? "underline" : "none",
                                 }}>偏差</button>
                       </div>
                       {/* Lean spot toggle (Track Map のみ視覚的に有効) */}
                       {session.hasValidGps && (
                         <label className="flex items-center gap-1 cursor-pointer select-none" style={{ color: COLORS.textMuted }}>
                           <input type="checkbox" checked={showLeanSpots}
                                  onChange={(e) => setShowLeanSpots(e.target.checked)}
                                  style={{ accentColor: COLORS.danger }} />
                           <span>リーンスポット</span>
                           {showLeanSpots && leanSpots.total > 0 && (
                             <span className="ml-1">
                               (<span style={{ color: "#ef4444" }}>危{leanSpots.dangerReal}{leanSpots.dangerFC > 0 && <span style={{ opacity: 0.6 }}>+{leanSpots.dangerFC}FC</span>}</span>
                               {" "}<span style={{ color: "#f97316" }}>警{leanSpots.warningReal}{leanSpots.warningFC > 0 && <span style={{ opacity: 0.6 }}>+{leanSpots.warningFC}FC</span>}</span>
                               {" "}<span style={{ color: "#eab308" }}>注{leanSpots.cautionReal}{leanSpots.cautionFC > 0 && <span style={{ opacity: 0.6 }}>+{leanSpots.cautionFC}FC</span>}</span>)
                             </span>
                           )}
                         </label>
                       )}
                       <div style={{ color: COLORS.textMuted }}>
                         {viewMode === "heatmap"
                           ? (colorMode === "afr"
                               ? `target ${AFR_TARGET.low.toFixed(1)}–${AFR_TARGET.high.toFixed(1)} (mid ${AFR_TARGET.mid.toFixed(1)})`
                               : `偏差 = WBO2 − Target  (0=合致 / +=リーン / −=リッチ)`)
                           : (session.hasValidGps
                               ? `${session.gpsValidCount} GPS pts · ${session.autoLaps?.length || 0} laps detected`
                               : "GPS データなし")}
                       </div>
                     </div>
                   }>
              <div className="flex border-b" style={{ borderColor: COLORS.border }}>
                <button onClick={() => setViewMode("heatmap")}
                        className="font-mono text-[10px] uppercase tracking-wider px-4 py-2 transition flex-1"
                        style={{
                          background: viewMode === "heatmap" ? COLORS.cell : "transparent",
                          color: viewMode === "heatmap" ? COLORS.accent : COLORS.textMuted,
                          borderBottom: viewMode === "heatmap" ? `2px solid ${COLORS.accent}` : "2px solid transparent",
                        }}>
                  ▦ Heatmap
                </button>
                <button onClick={() => setViewMode("track")}
                        disabled={!session.hasValidGps}
                        className="font-mono text-[10px] uppercase tracking-wider px-4 py-2 transition flex-1 disabled:opacity-40 disabled:cursor-not-allowed"
                        style={{
                          background: viewMode === "track" ? COLORS.cell : "transparent",
                          color: viewMode === "track" ? COLORS.accent : COLORS.textMuted,
                          borderBottom: viewMode === "track" ? `2px solid ${COLORS.accent}` : "2px solid transparent",
                        }}>
                  ◉ Track Map {!session.hasValidGps && "(GPS なし)"}
                </button>
              </div>

              {viewMode === "heatmap" && (
                <FuelMapHeatmap cells={cells} rpmRange={rpmRange} tpsRange={tpsRange}
                                hoveredCell={hoveredCell} setHoveredCell={setHoveredCell}
                                colorMode={colorMode} />
              )}
              {viewMode === "track" && session.hasValidGps && (
                <TrackView samples={filteredSamples}
                           circuitDetection={session.circuitDetection}
                           hoveredCell={hoveredCell}
                           rpmRange={rpmRange} tpsRange={tpsRange}
                           rpmBins={rpmBins} tpsBins={tpsBins}
                           onSelectFromMap={handleSelectFromMap}
                           colorMode={colorMode}
                           leanSpots={leanSpots}
                           showLeanSpots={showLeanSpots} />
              )}
            </Panel>

            {/* Cell detail */}
            <Panel title="Cell detail" accent>
              <CellDetail hovered={hoveredCell} rpmRange={rpmRange} tpsRange={tpsRange}
                          rpmBins={rpmBins} tpsBins={tpsBins} />
            </Panel>
          </div>

          {/* RIGHT — sidebar */}
          <div className="space-y-3">
            <Panel title="Map stats" accent>
              <StatsPanel stats={stats} rpmBins={rpmBins} tpsBins={tpsBins} rpmRange={rpmRange} tpsRange={tpsRange} />
            </Panel>

            <Panel title={colorMode === "dev" ? "Deviation colour scale" : "AFR colour scale"} accent>
              <div className="p-3">
                <AfrLegend colorMode={colorMode} />
              </div>
            </Panel>

            <Panel title="Grid settings" accent>
              <SettingsPanel rpmBins={rpmBins} setRpmBins={setRpmBins}
                             tpsBins={tpsBins} setTpsBins={setTpsBins}
                             rpmRange={rpmRange} setRpmRange={setRpmRange}
                             tpsRange={tpsRange} setTpsRange={setTpsRange}
                             autoRange={autoRange} setAutoRange={setAutoRange} />
            </Panel>
          </div>
        </main>
      )}

      {aboutOpen && <AboutModal onClose={() => setAboutOpen(false)} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
